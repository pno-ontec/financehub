# ─────────────────────────────────────────────────────────────────────────────
# FinanceHub — docker-compose.yml (PRODUÇÃO)
# Uso na VPS: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Aplicação Node.js ────────────────────────────────────────────────────────
  app:
    image: ghcr.io/pno-ontec/financehub:latest   # imagem do GitHub Container Registry
    container_name: financehub_app
    restart: unless-stopped

    volumes:
      - financehub_data:/app/server/data               # dados criptografados persistidos
      - financehub_uploads:/app/server/uploads

    env_file:
      - ./server/.env                                  # arquivo .env na VPS (nunca no git)

    environment:
      - NODE_ENV=production

    networks:
      - financehub_net

    # NÃO expõe porta para fora — apenas o Nginx acessa internamente
    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Limita recursos (evita consumo excessivo)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Nginx Reverse Proxy + SSL ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: financehub_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/financehub-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx

    networks:
      - financehub_net

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot (renovação automática SSL) ───────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: financehub_certbot
    restart: unless-stopped

    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

    # Renova a cada 12h (certbot só age se faltam <30 dias)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

    networks:
      - financehub_net

# ─────────────────────────────────────────────────────────────────────────────
networks:
  financehub_net:
    driver: bridge

volumes:
  financehub_data:      # dados criptografados AES-256
  financehub_uploads:   # uploads temporários
  certbot_www:          # desafio ACME do Let's Encrypt
  certbot_conf:         # certificados SSL
  nginx_logs:           # logs do Nginx
