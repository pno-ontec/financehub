# FinanceHub — docker-compose.yml PRODUÇÃO com PostgreSQL
# Uso: docker compose up -d

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: financehub_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${PGDATABASE:-financehub}
      POSTGRES_USER:     ${PGUSER:-financehub}
      POSTGRES_PASSWORD: ${PGPASSWORD}

    volumes:
      - pg_data:/var/lib/postgresql/data

    networks:
      - financehub_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-financehub} -d ${PGDATABASE:-financehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Limita recursos
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Aplicação Node.js ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financehub_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV:   production
      PGHOST:     postgres
      PGPORT:     "5432"
      PGDATABASE: ${PGDATABASE:-financehub}
      PGUSER:     ${PGUSER:-financehub}
      PGPASSWORD: ${PGPASSWORD}

    volumes:
      - app_uploads:/app/server/uploads

    networks:
      - financehub_net

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: financehub_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/financehub-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

    networks:
      - financehub_net

    depends_on:
      app:
        condition: service_healthy

networks:
  financehub_net:
    driver: bridge

volumes:
  pg_data:       # dados do PostgreSQL (persiste entre restarts)
  app_uploads:   # uploads de OFX/CSV
  certbot_www:   # Let's Encrypt challenge
  certbot_conf:  # certificados SSL
