name: Build e Deploy FinanceHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        run: echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u pno-ontec --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/pno-ontec/financehub:latest
          no-cache: true

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/financehub
            echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u pno-ontec --password-stdin
            docker compose pull app
            docker compose up -d --no-deps app nginx
            sleep 15
            docker compose ps
            docker compose logs app --tail=20
